<svg width="760" height="200" viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bolt" x1="30" y1="10" x2="150" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.45" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0047E1"/>
    </linearGradient>
    <linearGradient id="keyg" x1="70" y1="70" x2="130" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FE3FF"/>
    </linearGradient>
    <linearGradient id="word" x1="200" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
