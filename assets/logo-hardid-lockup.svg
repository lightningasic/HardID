      <path d="M0 32 L0 82 M0 62 L17 62 M0 82 L22 82" stroke="url(#keyg)" stroke-width="11" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="210" y="110" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="url(#word)">HardID</text>
  <text x="216" y="154" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="4" fill="#6E7B8B">HARDWARE WALLET</text>
