name: host-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run all host test suites
        run: |
          cd tests
          set -e
          for t in rng hkdf seed keccak sha512 bip39 base58 bip32 pin policy clearsign multisig se psbt boot ecdsa eip712 acl16 composite app transport_esp32 transport_i2c board linkproto linksvc phys_entropy secp256r1 cbor fido ctaphid; do
            if [ "$t" = "hkdf" ]; then
              gcc -Wall -Wextra -O1 -o test_$t test_$t.c ../core/hkdf.c
            elif [ "$t" = "phys_entropy" ]; then
              gcc -Wall -Wextra -O1 -o test_$t test_$t.c ../core/phys_entropy.c
            else
              gcc -Wall -Wextra -O1 -o test_$t test_$t.c
            fi
            ./test_$t > /dev/null
            echo "$t PASS"
          done
      - name: fuzz parsers (ASan/UBSan, 50k iters)
        run: |
          cd fuzz
          make
          ./fuzz_parsers 50000
